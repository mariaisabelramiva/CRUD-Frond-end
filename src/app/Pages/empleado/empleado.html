<div class="form-card mat-elevation-z2">
  <div class="form-card-header">Empleado</div>

  <form [formGroup]="formEmpleado" (ngSubmit)="guardar()" class="form-inner">

    <mat-form-field appearance="outline">
      <mat-label>Ciudad</mat-label>
      <mat-select formControlName="idCiudad">
        <mat-option [value]="0" disabled>Seleccione una ciudad</mat-option>
        @for (ciudad of listaCiudades; track ciudad.idCiudad) {
          <mat-option [value]="ciudad.idCiudad">{{ ciudad.ciudad }} - {{ ciudad.departamento }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nombre completo</mat-label>
      <input matInput formControlName="nombreCompleto">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>correo</mat-label>
      <input matInput formControlName="correo">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Sueldo</mat-label>
      <input matInput type="number" formControlName="sueldo">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha Contrato</mat-label>
      <input matInput type="date" formControlName="fechaContrato">
    </mat-form-field>

     

    <div class="form-actions">
      <button mat-raised-button class="btn-primary" type="submit" [disabled]="guardando">{{ guardando ? 'Guardando...' : 'Guardar' }}</button>
      <button mat-button class="btn-secondary" type="button" (click)="volver()">Volver</button>
    </div>

  </form>
</div>
