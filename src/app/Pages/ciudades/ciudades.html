<div class="form-card mat-elevation-z2">
  <div class="form-card-header">Ciudades</div>

  <form [formGroup]="formCiudades" (ngSubmit)="guardar()" class="form-inner">

    <mat-form-field appearance="outline">
      <mat-label>Ciudades y departamentos</mat-label>
      <input matInput formControlName="nombreCompleto">
    </mat-form-field>


    <div class="form-actions">
      <button mat-raised-button class="btn-primary" type="submit">Guardar</button>
      <button mat-button class="btn-secondary" type="button" (click)="volver()">Volver</button>
    </div>

  </form>
</div>
