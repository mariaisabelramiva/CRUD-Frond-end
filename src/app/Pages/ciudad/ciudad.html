<div class="form-card mat-elevation-z2">
  <div class="form-card-header">Ciudades</div>

  <form [formGroup]="formCiudad" (ngSubmit)="guardarCiudad()" class="form-inner">

    <mat-form-field appearance="outline">
      <mat-label>Ciudad</mat-label>
      <input matInput formControlName="Ciudad">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Departamento</mat-label>
      <input matInput formControlName="Departamento">
    </mat-form-field>



    <mat-form-field appearance="outline">
      <mat-label>Horario</mat-label>
      <input matInput type="date" formControlName="Horario">
    </mat-form-field>

     

    <div class="form-actions">
      <button mat-raised-button class="btn-primary" type="submit" [disabled]="guardando">{{ guardando ? 'Guardando...' : 'Guardar' }}</button>
      <button mat-button class="btn-secondary" type="button" (click)="volver()">Volver</button>
    </div>

  </form>
</div>
